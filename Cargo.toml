[package]
name = "kalyx"
version = "0.2.0-dev.1"
description = "The computer algebra library of casξ"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/casxi-lab/kalyx"
readme = "README.md"
keywords = ["computer-algebra", "cas", "polynomial", "rational", "symbolic"]
categories = ["mathematics", "science"]
# The repository checks, the allocation check, the guard lists, the proof
# tooling and the local configuration are not part of the published package.
exclude = [".cargo/", ".githooks/", ".github/", "xtask/", "checks/", "guard/", "verification/"]

[dependencies]
# Arbitrary-precision integers and rationals, wrapped by the `number` module;
# no type of these packages appears in the public interface.
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"

# The rules hold for every target of the package: the library, the program
# and the tests. Explicit panics are denied in non-test code; clippy.toml
# allows `unwrap`, `expect` and `panic!` in tests. Every `#[allow]` states
# its reason.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"

# The release profile keeps integer overflow checks: an overflow is a
# panic, never a silently wrapped value.
[profile.release]
overflow-checks = true

# The repository checks in xtask/, the allocation check in
# checks/allocation/ and the qualification crate of the proof tooling in
# verification/qualification/ are workspaces of their own.
[workspace]
exclude = ["xtask", "checks/allocation", "verification/qualification"]
