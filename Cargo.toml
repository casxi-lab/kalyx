[package]
name = "kalyx"
version = "0.1.0-dev.1"
description = "The computer algebra library of casξ"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

[dependencies]
# Arbitrary-precision integers and rationals, wrapped by the `number` module;
# no type of these packages appears in the public interface.
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"

# The rules hold for every target of the package: the library, the program
# and the tests. Explicit panics are denied in non-test code; clippy.toml
# allows `unwrap`, `expect` and `panic!` in tests. Every `#[allow]` states
# its reason.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"

# The release profile keeps integer overflow checks: an overflow is a
# panic, never a silently wrapped value.
[profile.release]
overflow-checks = true

# The repository checks in xtask/ are a workspace of their own.
[workspace]
exclude = ["xtask"]
