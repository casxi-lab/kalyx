# Tests may unwrap, expect and panic. Non-test code may not: Cargo.toml
# denies these lints for every target, and these settings exempt only test
# code (`#[test]` functions and `#[cfg(test)]` modules).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# The transcendental functions of the platform math library, which give
# results that differ between platforms. Clippy resolves the type, so a call
# through a type alias, a generic parameter or a trait is caught as well as
# `x.sin()` and `f64::sin(x)`; the guard step of `cargo xtask check` matches
# the names in non-test code. The entries apply to tests too. The `Float`
# and `Real` traits of num-traits provide the same functions; those entries
# take effect once the package depends on num-traits, and until then are
# `allow-invalid`.
disallowed-methods = [
    { path = "f32::sin", reason = "a transcendental function of the platform math library" },
    { path = "f32::cos", reason = "a transcendental function of the platform math library" },
    { path = "f32::tan", reason = "a transcendental function of the platform math library" },
    { path = "f32::sin_cos", reason = "a transcendental function of the platform math library" },
    { path = "f32::asin", reason = "a transcendental function of the platform math library" },
    { path = "f32::acos", reason = "a transcendental function of the platform math library" },
