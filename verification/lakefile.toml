# The Lake project of the hand-written Lean of kalyx and of the definitions
# that Aeneas generates. The Aeneas Lean library and the packages of its Lake
# lock, Mathlib among them, come from the pinned tool installation:
# `cargo xtask formal run` links them below `artifacts/formal/lake` of each
# directory in which it builds, and `lake-manifest.json` pins the packages of
# that lock, so that Lake resolves nothing. Generated definitions are written
# below `KalyxGen/` only in those directories and are never edited.
name = "kalyxVerification"
packagesDir = "../artifacts/formal/lake/packages"
defaultTargets = ["Kalyx"]

[[require]]
name = "aeneas"
path = "../artifacts/formal/lake/aeneas"

# Hand-written Lean: proofs, and the definitions that qualification cases
# install.
[[lean_lib]]
name = "Kalyx"
globs = ["Kalyx.+"]

# Definitions generated by Aeneas from the extracted Rust.
[[lean_lib]]
name = "KalyxGen"
globs = ["KalyxGen.+"]

# The root module `Kalyx`, which `cargo xtask formal run` writes in the
# directory of its base round to import every module below `Kalyx` and
# `KalyxGen`. It is never in the checkout.
[[lean_lib]]
name = "KalyxRoot"
roots = ["Kalyx"]
