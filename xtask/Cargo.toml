[package]
name = "xtask"
version = "0.0.0"
description = "Repository tasks for kalyx, run as `cargo xtask`"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

# xtask is a workspace of its own.
[workspace]

[dependencies]
# The workflows step uses the event parser on text that is already UTF-8,
# so the input-decoding support of the default feature is left out.
yaml-rust2 = { version = "=0.13.0", default-features = false }
# The guard step parses the Rust source of the package. Line numbers of
# findings need the span locations of proc-macro2.
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
